# Database Service for PostgreSQL
# Exposes the database within the cluster

apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: mathwizz
  labels:
    app: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: database
