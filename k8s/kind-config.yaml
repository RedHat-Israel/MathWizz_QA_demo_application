# Kind cluster configuration for MathWizz
# Creates a local Kubernetes cluster for development and testing

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mathwizz-cluster

nodes:
  - role: control-plane
    image: kindest/node:v1.31.0@sha256:53df588e04085fd41ae12de0c3fe4c72f7013bba32a20e7325357a1ac94ba865
    extraPortMappings:
      # Frontend service
      - containerPort: 30080
        hostPort: 3000
        protocol: TCP
      # Web-server API
      - containerPort: 30081
        hostPort: 8080
        protocol: TCP
