# Frontend Service
# Exposes the frontend via NodePort for external access

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: mathwizz
  labels:
    app: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: frontend
