# Frontend Deployment
# Manages the frontend pod lifecycle

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mathwizz
  labels:
    app: frontend
    component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: ui
    spec:
      containers:
        - name: frontend
          image: mathwizz/frontend:latest
          imagePullPolicy: Never  # Use local image from Kind
          ports:
            - containerPort: 80
              name: http
          env:
            - name: REACT_APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: mathwizz-config
                  key: REACT_APP_API_URL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5