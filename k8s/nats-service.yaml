# NATS Service for message queue
# Exposes NATS server within the cluster

apiVersion: v1
kind: Service
metadata:
  name: nats-service
  namespace: mathwizz
  labels:
    app: nats
spec:
  type: ClusterIP
  ports:
    - port: 4222
      targetPort: 4222
      protocol: TCP
      name: client
    - port: 8222
      targetPort: 8222
      protocol: TCP
      name: monitoring
  selector:
    app: nats
