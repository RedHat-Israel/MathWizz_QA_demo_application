# Web-Server Service
# Exposes the web-server API via NodePort for external access

apiVersion: v1
kind: Service
metadata:
  name: web-server-service
  namespace: mathwizz
  labels:
    app: web-server
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
      protocol: TCP
      name: http
  selector:
    app: web-server
