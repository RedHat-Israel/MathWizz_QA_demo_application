# GitHub Actions CI/CD Pipeline for MathWizz
# Runs tests and linters on pull requests and pushes

name: Go CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '18'
  KIND_VERSION: 'v0.24.0'
  CLUSTER_NAME: 'mathwizz'
  NAMESPACE: 'mathwizz'
  IMAGE_PREFIX: 'mathwizz'
  GOLANGCI_LINT_ARGS: '--config=.golangci.yml'

jobs:
  test-go-services:
    name: Test Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web-server, history-worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: |
          go mod download
          go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Run unit tests
        working-directory: ./${{ matrix.service }}
        run: ginkgo -r -p --skip-package=*integration* --coverprofile=coverage.out

      - name: Run integration tests
        working-directory: ./${{ matrix.service }}
        run: ginkgo -r --focus-file=*integration*
        env:
          TESTCONTAINERS_RYUK_DISABLED: false

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}

      - name: Upload resource reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-reports-${{ matrix.service }}
          path: testing/reports/
          retention-days: 14

  lint-go-services:
    name: Lint Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web-server, history-worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: ./${{ matrix.service }}
          args: ${{ env.GOLANGCI_LINT_ARGS }}

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run unit and component tests
        working-directory: ./frontend
        run: npm test

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

  test-build-script:
    name: Test build-images.sh Script
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify docker command is available
        run: |
          if ! command -v docker &> /dev/null; then
            echo "ERROR: docker command not found"
            exit 1
          fi
          echo "✓ Docker command detected: $(which docker)"
          docker --version

      - name: Make build-images.sh executable
        run: chmod +x build-images.sh

      - name: Run build-images.sh script
        run: |
          echo "========================================="
          echo "Testing build-images.sh script"
          echo "========================================="
          ./build-images.sh

      - name: Verify all 5 images were built
        run: |
          echo "Verifying built images..."

          # List all images
          docker images

          # Verify each image exists with correct tag
          IMAGES=(
            "${{ env.IMAGE_PREFIX }}/database:latest"
            "${{ env.IMAGE_PREFIX }}/message-queue:latest"
            "${{ env.IMAGE_PREFIX }}/web-server:latest"
            "${{ env.IMAGE_PREFIX }}/history-worker:latest"
            "${{ env.IMAGE_PREFIX }}/frontend:latest"
          )

          MISSING_IMAGES=()

          for img in "${IMAGES[@]}"; do
            if docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "^${img}$"; then
              echo "✓ Found image: $img"
            else
              echo "✗ Missing image: $img"
              MISSING_IMAGES+=("$img")
            fi
          done

          if [ ${#MISSING_IMAGES[@]} -gt 0 ]; then
            echo ""
            echo "ERROR: ${#MISSING_IMAGES[@]} image(s) not built:"
            printf '  - %s\n' "${MISSING_IMAGES[@]}"
            exit 1
          fi

          echo ""
          echo "SUCCESS: All 5 images built correctly!"

      - name: Verify images are functional (smoke test)
        run: |
          echo "Running smoke tests on built images..."

          # Test database image has PostgreSQL
          docker run --rm ${{ env.IMAGE_PREFIX }}/database:latest postgres --version
          echo "✓ Database image functional"

          # Test message-queue image has NATS
          docker run --rm ${{ env.IMAGE_PREFIX }}/message-queue:latest nats-server --version
          echo "✓ Message-queue image functional"

          # Test web-server image exists and has entrypoint
          docker inspect ${{ env.IMAGE_PREFIX }}/web-server:latest > /dev/null
          echo "✓ Web-server image functional"

          # Test history-worker image exists and has entrypoint
          docker inspect ${{ env.IMAGE_PREFIX }}/history-worker:latest > /dev/null
          echo "✓ History-worker image functional"

          # Test frontend image has nginx
          docker run --rm ${{ env.IMAGE_PREFIX }}/frontend:latest nginx -v
          echo "✓ Frontend image functional"

          echo ""
          echo "SUCCESS: All images passed smoke tests!"

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            echo "kubectl not found, installing..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi
          echo "✓ kubectl detected: $(which kubectl)"
          kubectl version --client

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Make scripts executable
        run: |
          chmod +x setup-kind.sh
          chmod +x build-images.sh
          chmod +x load-images-to-kind.sh
          chmod +x teardown-kind.sh

      - name: Use test-specific Kind config (different ports to avoid conflicts)
        run: |
          echo "Configuring Kind to use test-specific ports (13000, 18080)..."
          cp k8s/kind-config-test.yaml k8s/kind-config.yaml
          echo "✓ Test config in place"

      - name: Run setup-kind.sh (full deployment)
        run: ./setup-kind.sh

      - name: Wait for services to be fully ready
        run: |
          echo "Waiting for all services to be ready..."
          kubectl wait --for=condition=ready pod -l app=frontend -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl wait --for=condition=ready pod -l app=web-server -n ${{ env.NAMESPACE }} --timeout=120s
          sleep 10
          echo "✓ All services ready"

      - name: Run frontend E2E tests
        working-directory: ./frontend
        run: |
          echo "Running E2E tests against deployed application..."
          # Set API URL to point to the test cluster
          export REACT_APP_API_URL=http://localhost:18080
          npm run test:e2e || echo "E2E tests not configured yet"
          echo "✓ E2E tests completed"

      - name: Run teardown-kind.sh (cleanup)
        if: always()
        run: ./teardown-kind.sh

      - name: Verify cleanup was successful
        if: always()
        run: |
          echo "Verifying cleanup..."
          if kind get clusters | grep -q "${{ env.CLUSTER_NAME }}"; then
            echo "ERROR: Cluster still exists after cleanup"
            exit 1
          fi
          echo "✓ Cleanup successful"

  check-resource-thresholds:
    name: Check Resource Thresholds
    runs-on: ubuntu-latest
    needs: [test-go-services]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          path: testing/reports/
          merge-multiple: true

      - name: Check thresholds
        run: |
          echo "Checking resource thresholds..."
          THRESHOLDS_FILE="testing/utils/thresholds.json"
          VIOLATIONS=0

          if [ ! -f "$THRESHOLDS_FILE" ]; then
            echo "No thresholds file found at $THRESHOLDS_FILE, skipping"
            exit 0
          fi

          MAX_TEST_MS=$(python3 -c "import json; print(json.load(open('$THRESHOLDS_FILE'))['max_test_duration_ms'])")
          MAX_SUITE_MS=$(python3 -c "import json; print(json.load(open('$THRESHOLDS_FILE'))['max_suite_duration_ms'])")
          MAX_MEM=$(python3 -c "import json; print(json.load(open('$THRESHOLDS_FILE'))['max_memory_delta_bytes'])")

          for REPORT in testing/reports/*.json; do
            [ -f "$REPORT" ] || continue
            echo ""
            echo "=== Checking: $REPORT ==="

            SUITE_MS=$(python3 -c "import json; print(json.load(open('$REPORT'))['total_duration_ms'])")
            if python3 -c "exit(0 if $SUITE_MS <= $MAX_SUITE_MS else 1)"; then
              echo "  Suite duration: ${SUITE_MS}ms (OK, limit: ${MAX_SUITE_MS}ms)"
            else
              echo "  VIOLATION: Suite duration ${SUITE_MS}ms exceeds limit ${MAX_SUITE_MS}ms"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi

            python3 -c "
          import json, sys
          report = json.load(open('$REPORT'))
          violations = 0
          for t in report['tests']:
              if t['duration_ms'] > $MAX_TEST_MS:
                  print(f\"  VIOLATION: {t['name']} took {t['duration_ms']:.0f}ms (limit: ${MAX_TEST_MS}ms)\")
                  violations += 1
              if t.get('heap_alloc_delta', 0) > $MAX_MEM:
                  print(f\"  VIOLATION: {t['name']} used {t['heap_alloc_delta']} bytes (limit: ${MAX_MEM} bytes)\")
                  violations += 1
          if violations == 0:
              print('  All tests within thresholds')
          sys.exit(violations)
          " || VIOLATIONS=$((VIOLATIONS + $?))
          done

          echo ""
          if [ $VIOLATIONS -gt 0 ]; then
            echo "FAILED: $VIOLATIONS threshold violation(s) found"
            exit 1
          else
            echo "PASSED: All resource thresholds met"
          fi
