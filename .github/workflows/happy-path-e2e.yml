# ============================================================================
# SPREAD THE JOY: Happy Path E2E Test
# ============================================================================
#
# This workflow tests MathWizz's complete user journey: register, login,
# solve a math problem, and verify it appears in history.
#
# TO ADAPT THIS FOR ANOTHER TEAM'S CI:
# If your product integrates with MathWizz and you want an early warning
# when changes break the integration, you can create a lightweight version
# of this workflow:
#
# 1. Keep the Kind cluster setup/teardown steps as-is
# 2. Replace the Playwright test step with simple curl commands:
#
#    # Register
#    curl -s -o /dev/null -w "%{http_code}" -c cookies.txt \
#      -X POST http://localhost:8080/register \
#      -H "Content-Type: application/json" \
#      -d '{"email":"test@example.com","password":"testpass123"}'
#
#    # Login
#    curl -s -o /dev/null -w "%{http_code}" -c cookies.txt \
#      -X POST http://localhost:8080/login \
#      -H "Content-Type: application/json" \
#      -d '{"email":"test@example.com","password":"testpass123"}'
#
#    # Solve
#    curl -s -b cookies.txt \
#      -X POST http://localhost:8080/solve \
#      -H "Content-Type: application/json" \
#      -d '{"problem":"25+75"}'
#    # Expected: {"answer":100}
#
#    # Verify history
#    curl -s -b cookies.txt http://localhost:8080/history
#    # Expected: JSON array containing the solved problem
#
# 3. Remove the Node.js/Playwright setup steps
# 4. Add this workflow to your repo's .github/workflows/
# ============================================================================

name: Happy Path E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '18'
  KIND_VERSION: 'v0.24.0'
  CLUSTER_NAME: 'mathwizz'
  NAMESPACE: 'mathwizz'

jobs:
  happy-path:
    name: Happy Path E2E Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi
          kubectl version --client

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Make scripts executable
        run: |
          chmod +x setup-kind.sh
          chmod +x build-images.sh
          chmod +x load-images-to-kind.sh
          chmod +x teardown-kind.sh

      - name: Use test-specific Kind config
        run: |
          cp k8s/kind-config-test.yaml k8s/kind-config.yaml

      - name: Deploy MathWizz to Kind cluster
        run: ./setup-kind.sh

      - name: Wait for services to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=frontend -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl wait --for=condition=ready pod -l app=web-server -n ${{ env.NAMESPACE }} --timeout=120s
          sleep 10

      - name: Run happy path E2E test
        working-directory: ./frontend
        run: npx playwright test e2e/happy-path.e2e.test.js
        env:
          FRONTEND_URL: http://localhost:13000
          REACT_APP_API_URL: http://localhost:18080
          CI: true

      - name: Teardown Kind cluster
        if: always()
        run: ./teardown-kind.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-path-reports
          path: |
            frontend/playwright-report/
            testing/reports/
          retention-days: 14
