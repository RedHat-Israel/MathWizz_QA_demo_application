# MathWizz NATS Server Configuration
# Lightweight message broker for decoupling web-server and history-worker

# Server name
server_name: mathwizz-nats

# Listen on all interfaces
listen: 0.0.0.0:4222

# HTTP monitoring port
http_port: 8222

# Enable JetStream for persistence (optional, but useful for production-like setup)
jetstream {
    store_dir: /data/jetstream
    max_memory_store: 1GB
    max_file_store: 10GB
}

# Logging
debug: false
trace: false
logtime: true

# Limits
max_payload: 1MB
max_connections: 100
max_control_line: 512

# Ping interval
ping_interval: 2m
ping_max: 3

# Write deadline
write_deadline: 10s
